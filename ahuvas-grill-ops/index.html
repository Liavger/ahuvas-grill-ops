<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Firebase Test</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.status{font-size:20px;font-weight:600;padding:16px 24px;border-radius:10px}
.ok{background:#0d2a0d;color:#5fd45f;border:1px solid #5fd45f}
.err{background:#2a0a0a;color:#ff5f5f;border:1px solid #ff5f5f}
.loading{background:#0a1a2a;color:#5fa8ff;border:1px solid #5fa8ff}
</style>
</head>
<body>
<div style="font-size:28px">🔥 Ahuvas Grill</div>
<div class="status loading" id="status">Testing Firebase connection...</div>
<div id="detail" style="font-size:13px;color:#aaa"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA2sCLF1nKHvT70IvJx1jYkn1rByTVWSeM",
  authDomain: "ahuvas-grill-ops.firebaseapp.com",
  projectId: "ahuvas-grill-ops",
  storageBucket: "ahuvas-grill-ops.firebasestorage.app",
  messagingSenderId: "1075696803010",
  appId: "1:1075696803010:web:7e47587ca043194e506f5b"
};

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  await setDoc(doc(db, 'test', 'ping'), { ok: true, time: new Date().toISOString() });
  document.getElementById('status').className = 'status ok';
  document.getElementById('status').textContent = '✅ Firebase connected!';
  document.getElementById('detail').textContent = 'Database is working. Ready to build.';
} catch(e) {
  document.getElementById('status').className = 'status err';
  document.getElementById('status').textContent = '❌ Connection failed';
  document.getElementById('detail').textContent = e.message;
}
</script>
</body>
</html>
